<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Tres Puntos</title>

  <link rel="icon" type="image/x-icon" href="assets/favicon.png" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,700" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Lora:400,700" rel="stylesheet" />

  <!-- Styles -->
  <link href="css/styles.css" rel="stylesheet" />
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg fixed-top shadow bg-light px-4" style="border-radius: 1.5rem; top:20px; width:90%; max-width:1140px; margin:auto;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="assets/favicon.png" alt="Tres Puntos" style="width:32px" class="me-2">
        <strong>Admin</strong>
      </a>
    </div>
  </nav>

  <!-- ADMIN PANEL -->
  <section class="container" style="margin-top:140px; max-width:800px">
    <div class="card shadow p-4">

      <h2 class="mb-4 text-center">Panel Admin – Productos</h2>

      <form id="adminForm">

        <!-- Nombre -->
        <div class="mb-3">
          <label class="form-label">Nombre del producto</label>
          <input type="text" class="form-control" id="nombre" required>
        </div>

        <!-- ID -->
        <div class="mb-3">
          <label class="form-label">ID interno (ej: AX-01)</label>
          <input type="text" class="form-control" id="id" required>
        </div>

        <!-- Categoría -->
        <div class="mb-3">
          <label class="form-label">Categoría</label>
          <select class="form-select" id="categoria" required>
            <option value="">Seleccionar</option>
            <option value="metal">Plegaderas de metal</option>
            <option value="teflon">Plegaderas de teflón</option>
            <option value="set">Set de plegaderas</option>
            <option value="punzones">Punzones</option>
            <option value="cortantes">Cortantes</option>
          </select>
        </div>

        <!-- Precio -->
        <div class="mb-3">
          <label class="form-label">Precio</label>
          <input type="number" class="form-control" id="precio" required>
        </div>

        <!-- Imágenes -->
        <div class="mb-3">
          <label class="form-label">URLs de imágenes (una por línea)</label>
          <textarea class="form-control" id="imagenes" rows="3"></textarea>
        </div>

        <!-- Detalles -->
        <div class="mb-3">
          <label class="form-label">Detalles (uno por línea)</label>
          <textarea class="form-control" id="detalles" rows="3"></textarea>
        </div>

        <!-- Botones -->
        <div class="d-flex gap-3">
          <button type="submit" class="btn btn-success">
            Guardar producto
          </button>
        </div>
      </form>

      <hr class="my-4">

      <!-- ELIMINAR -->
      <h5>Eliminar producto</h5>
      <div class="input-group">
        <input type="text" class="form-control" id="deleteId" placeholder="ID de MongoDB">
        <button class="btn btn-danger" onclick="eliminarProducto()">Eliminar</button>
      </div>

      <div id="msg" class="mt-3"></div>

    </div>
  </section>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API = "https://trespuntos.onrender.com";

    const form = document.getElementById("adminForm");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async e => {
      e.preventDefault();

      const data = {
        id: document.getElementById("id").value.trim(),
        nombre: document.getElementById("nombre").value.trim(),
        categoria: document.getElementById("categoria").value,
        precio: Number(document.getElementById("precio").value),
        imagenes: document.getElementById("imagenes").value.split("\n").filter(Boolean),
        detalles: document.getElementById("detalles").value.split("\n").filter(Boolean)
      };

      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const json = await res.json();

        msg.innerHTML = `<div class="alert alert-success">Producto guardado ✔</div>`;
        form.reset();
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-danger">Error al guardar</div>`;
      }
    });

    async function eliminarProducto() {
      const id = document.getElementById("deleteId").value.trim();
      if (!id) return;

      if (!confirm("¿Eliminar producto?")) return;

      try {
        await fetch(`${API}/${id}`, { method: "DELETE" });
        msg.innerHTML = `<div class="alert alert-warning">Producto eliminado</div>`;
      } catch {
        msg.innerHTML = `<div class="alert alert-danger">Error al eliminar</div>`;
      }
    }
  </script>

</body>
</html>
